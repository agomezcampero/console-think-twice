name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Standard Ruby
        uses: standardrb/standard-ruby-action@v1
        with:
          autofix: false

  test:
    runs-on: ubuntu-latest
    name: test (ruby ${{ matrix.ruby-version }}, activerecord ${{ matrix.activerecord || 'newest' }})

    strategy:
      fail-fast: false
      matrix:
        # The guard reads Active Record's own call stack, so the supported range is covered
        # rather than the newest release alone. Old Active Record is paired with the oldest
        # Ruby it runs on, and the newest with every Ruby the gemspec allows.
        include:
          - { ruby-version: "3.1", activerecord: "7.0" }
          - { ruby-version: "3.1", activerecord: "7.1" }
          - { ruby-version: "3.2", activerecord: "7.2" }
          - { ruby-version: "3.3", activerecord: "8.0" }
          - { ruby-version: "3.2", activerecord: "" }
          - { ruby-version: "3.3", activerecord: "" }
          - { ruby-version: "3.4", activerecord: "" }

    env:
      ACTIVERECORD_VERSION: ${{ matrix.activerecord }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
